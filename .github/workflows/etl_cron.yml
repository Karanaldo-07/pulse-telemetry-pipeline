name: Pulse Telemetry Automated ETL

on:
  schedule:
    # Runs automatically every 6 hours (UTC) and keeps Supabase permanently active
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allows instant one-click manual execution from the GitHub Actions tab

jobs:
  run-telemetry-etl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Idempotent ETL & Z-Score Anomaly Detector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.run_pipeline github_actions